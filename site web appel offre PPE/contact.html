<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Nexweb</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="marque" href="index.html">Nexweb</a>
    <a href="index.html">Accueil</a>
  </header>

  <main>
    <h1>Contactez-nous</h1>
    <p>Une idée, une question ou besoin d’un nouveau site ? Décrivez-nous votre projet.</p>

    <form action="mailto:giroux-lermet.baptiste@lycee-saintdenis.com,revirand.joan@lycee-saintdenis.com" method="post" enctype="text/plain">
      <label for="prenom">Votre prénom</label>
      <input id="prenom" name="Prénom" type="text" autocomplete="given-name" required>
      
      <label for="nom">Votre nom</label>
      <input id="nom" name="Nom" type="text" autocomplete="name" required>

      <label for="email">Votre adresse e-mail</label>
      <input id="email" name="E-mail" type="email" autocomplete="email" required>

      <label for="message">Votre message</label>
      <textarea id="message" name="Message" rows="6" required></textarea>

      <button type="submit" class="bouton">Préparer mon e-mail</button>
    </form>

    <p><a class="bouton" href="index.html">← Retour à l’accueil</a></p>
  </main>
</body>
</html>
